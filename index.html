/* ── helpers ──────────────────────────────────────────────────── */
function mkRng(seed){
  let s=seed>>>0;
  return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
}
function hexToRgb(h){
  h=h.replace("#","");
  if(h.length===3) h=h.split("").map(x=>x+x).join("");
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function lumOf(r){ return 0.299*r[0]+0.587*r[1]+0.114*r[2]; }
function loadImg(src){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>res(im);
    im.onerror=()=>rej(new Error("image load failed"));
    im.src=src;
  });
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error("file read failed"));
    r.readAsDataURL(file);
  });
}
function imgToBase64(img,maxDim){
  let w=img.width,h=img.height;
  const ar=w/h;
  if(Math.max(w,h)>maxDim){
    if(w>=h){ w=maxDim; h=Math.round(maxDim/ar); }
    else    { h=maxDim; w=Math.round(maxDim*ar); }
  }
  const c=document.createElement("canvas");
  c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return { media_type:"image/jpeg", data:c.toDataURL("image/jpeg",0.9).split(",")[1] };
}

/* ── AI design generation (via the Cloudflare worker) ─────────── */
function extractSVG(raw){
  const m=(raw||"").match(/<svg[\s\S]*?<\/svg>/i);
  return m?m[0]:null;
}
async function callAI(system,content,maxTokens){
  const res=await fetch(AI_ENDPOINT,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      model:AI_MODEL, max_tokens:maxTokens, system:system,
      messages:[{role:"user",content:content}]
    })
  });
  const data=await res.json();
  if(data&&Array.isArray(data.content))
    return data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  return "";
}
function aiSystem(style,c1,c2,c3){
  return `You are a master illustrator who draws directly in SVG for a line of handmade greeting cards. Your work is clean, confident and beautiful. It must never look like a clip-art icon or a flat diagram.

OUTPUT (strict):
- Reply with raw SVG only. Start with <svg and end with </svg>. No prose, no markdown.
- Root: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
- Allowed elements only: path, circle, ellipse, rect, polygon, line, polyline, g, defs, linearGradient, radialGradient, clipPath, use.
- No text, no images, no external references.

COLOUR (strict):
- Use only ${c1} as dominant, ${c2} as secondary, ${c3} as accent, and #FFFFFF for highlights.
- Build depth with opacity and with gradients between these colours. Introduce no other hues.

STYLE: ${style.desc}

MAKE IT BEAUTIFUL:
- One clear focal subject, confident asymmetric composition. Fill the 400x400 frame with intention and keep elegant breathing room.
- Three depth layers: a soft simple background, the detailed subject in the mid-ground, small crisp foreground accents.
- Real detail in the focal area: texture strokes, fine inner linework, small marks the eye can explore.
- Organic bezier curves, not stiff circles or straight lines where a curve belongs. Vary line weight for life.
- Put gradients on at least three major shapes for dimension.
- The result must look hand-crafted by a skilled artist. Crude, flat or icon-like results are failures.`;
}
async function genSVG(description,styleId,c1,c2,c3,image){
  const style=ART_STYLES.find(s=>s.id===styleId)||ART_STYLES[0];
  const sys=aiSystem(style,c1,c2,c3);
  let content;
  if(image){
    content=[
      {type:"image",source:{type:"base64",media_type:image.media_type,data:image.data}},
      {type:"text",text:`Study the reference photo above. Capture its essential subject, character and arrangement, then reimagine it as ${style.label} artwork following every rule. Interpret it, do not trace it. This is the hero illustration for a handmade greeting card. Make it genuinely beautiful.`}
    ];
  }else{
    content=[{type:"text",text:`Create the hero illustration for a handmade greeting card.\nSubject: "${description}"\nStyle: ${style.label}.\nMake it genuinely beautiful, detailed and elegant. Use ${c1} dominant, ${c2} secondary, ${c3} accent.`}];
  }
  try{
    const raw=await callAI(sys,content,8000);
    return extractSVG(raw);
  }catch(e){ return null; }
}
async function refineSVG(svg,styleId,c1,c2,c3){
  const style=ART_STYLES.find(s=>s.id===styleId)||ART_STYLES[0];
  const sys=`You are an exacting art director improving an SVG illustration for a handmade greeting card. You receive one SVG and return a clearly better one.

Judge it honestly, then fix every weakness:
- Does it look hand-crafted and beautiful, or flat and crude like clip-art? Push it firmly toward beautiful.
- Strengthen the focal point and the overall composition. Improve the asymmetric balance.
- Add depth through layering, overlap and gradients on major shapes.
- Add fine detail and texture in the focal area. Smooth any clumsy curves.
- Keep the ${style.label} character: ${style.desc}
- Colours: only ${c1}, ${c2}, ${c3}, #FFFFFF and their opacities; gradients between them are welcome.

OUTPUT: raw SVG only, start with <svg and end with </svg>, viewBox="0 0 400 400" width="400" height="400". Allowed elements only: path, circle, ellipse, rect, polygon, line, polyline, g, defs, linearGradient, radialGradient, clipPath, use. No text or external references.`;
  try{
    const raw=await callAI(sys,[{type:"text",text:`Refine this illustration to a higher standard:\n\n${svg}`}],8000);
    return extractSVG(raw)||svg;
  }catch(e){ return svg; }
}

/* ── photo stylization (client-side, no network) ──────────────── */
function stylizePhoto(img,mode,strength,c1,c2,c3){
  const maxDim=700;
  let w=img.width,h=img.height;
  const ar=w/h;
  if(Math.max(w,h)>maxDim){
    if(w>=h){ w=maxDim; h=Math.round(maxDim/ar); }
    else    { h=maxDim; w=Math.round(maxDim*ar); }
  }
  const cv=document.createElement("canvas");
  cv.width=w; cv.height=h;
  const ctx=cv.getContext("2d");
  ctx.drawImage(img,0,0,w,h);
  const id=ctx.getImageData(0,0,w,h);
  const d=id.data;
  if(mode==="poster"){
    const levels=Math.max(2,Math.round(2+strength*5));
    const step=255/(levels-1);
    for(let i=0;i<d.length;i+=4){
      d[i]  =Math.round(Math.round(d[i]  /step)*step);
      d[i+1]=Math.round(Math.round(d[i+1]/step)*step);
      d[i+2]=Math.round(Math.round(d[i+2]/step)*step);
    }
    ctx.putImageData(id,0,0);
  }else if(mode==="ink"){
    const g=new Float32Array(w*h);
    for(let i=0,p=0;i<d.length;i+=4,p++)
      g[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const out=ctx.createImageData(w,h), od=out.data;
    const thr=18+(1-strength)*95;
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const p=y*w+x;
        let gx=0,gy=0;
        if(x>0&&x<w-1&&y>0&&y<h-1){
          const tl=g[p-w-1],tt=g[p-w],tr=g[p-w+1],
                ll=g[p-1],            rr=g[p+1],
                bl=g[p+w-1],bb=g[p+w],br=g[p+w+1];
          gx=(tr+2*rr+br)-(tl+2*ll+bl);
          gy=(bl+2*bb+br)-(tl+2*tt+tr);
        }
        const mag=Math.sqrt(gx*gx+gy*gy);
        const v=mag>thr?0:255;
        const o=p*4;
        od[o]=od[o+1]=od[o+2]=v; od[o+3]=255;
      }
    }
    ctx.putImageData(out,0,0);
  }else{
    const ramp=[hexToRgb(c1),hexToRgb(c2),hexToRgb(c3),[255,255,255]]
                 .sort((a,b)=>lumOf(a)-lumOf(b));
    const contrast=0.65+strength*1.7;
    for(let i=0;i<d.length;i+=4){
      let L=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;
      L=Math.min(1,Math.max(0,(L-0.5)*contrast+0.5));
      const seg=L*(ramp.length-1);
      const idx=Math.min(ramp.length-2,Math.floor(seg));
      const f=seg-idx, a=ramp[idx], b=ramp[idx+1];
      d[i]  =Math.round(a[0]+(b[0]-a[0])*f);
      d[i+1]=Math.round(a[1]+(b[1]-a[1])*f);
      d[i+2]=Math.round(a[2]+(b[2]-a[2])*f);
    }
    ctx.putImageData(id,0,0);
  }
  return cv.toDataURL("image/png");
}

/* ── drawing primitives ───────────────────────────────────────── */
function drawLeaf(ctx,x,y,len,angle,color){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(len*.25,-len*.28,len*.75,-len*.28,len,0);
  ctx.bezierCurveTo(len*.75,len*.28,len*.25,len*.28,0,0);
  ctx.fillStyle=color;ctx.fill();ctx.restore();
}
function drawStar(ctx,cx,cy,r,pts,fill,stroke){
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const a=(i/(pts*2))*Math.PI*2-Math.PI/2,rad=i%2===0?r:r*.42;
    i===0?ctx.moveTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad):ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);
  }
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke();}
}
function drawHeart(ctx,cx,cy,r,fill){
  ctx.save();ctx.translate(cx,cy);ctx.scale(r/28,r/28);
  ctx.beginPath();ctx.moveTo(0,-8);
  ctx.bezierCurveTo(-28,-28,-28,12,0,28);ctx.bezierCurveTo(28,12,28,-28,0,-8);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.restore();
}

/* ── floral ───────────────────────────────────────────────────── */
function pDaisy(ctx,W,H,c1,c2,c3,density,seed){
  const r=mkRng(seed),n=density*5+8;
  for(let i=0;i<n;i++) drawLeaf(ctx,r()*W,r()*H,14+r()*18,r()*Math.PI*2,c3+"88");
  for(let i=0;i<n;i++){
    const cx=r()*W,cy=r()*H,rad=13+r()*18,col=[c1,c2,c3][i%3],ctr=[c2,c3,c1][i%3];
    for(let p=0;p<8;p++){
      const a=(p/8)*Math.PI*2;
      ctx.beginPath();ctx.ellipse(cx+Math.cos(a)*rad*.62,cy+Math.sin(a)*rad*.62,rad*.3,rad*.17,a,0,Math.PI*2);
      ctx.fillStyle=col+"CC";ctx.fill();
    }
    ctx.beginPath();ctx.arc(cx,cy,rad*.23,0,Math.PI*2);ctx.fillStyle=ctr;ctx.fill();
  }
}
function pRoses(ctx,W,H,c1,c2,c3,density,seed){
  const r=mkRng(seed);
  function rose(cx,cy,rad,col1,col2){
    for(let i=0;i<5;i++){
      const a=(i/5)*Math.PI*2-Math.PI/2;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
      ctx.beginPath();ctx.ellipse(0,-rad*.58,rad*.34,rad*.48,0,0,Math.PI*2);
      ctx.fillStyle=col1+"BB";ctx.fill();ctx.restore();
    }
    for(let i=0;i<5;i++){
      const a=(i/5)*Math.PI*2+Math.PI/5-Math.PI/2;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
      ctx.beginPath();ctx.ellipse(0,-rad*.34,rad*.22,rad*.28,0,0,Math.PI*2);
      ctx.fillStyle=col2+"DD";ctx.fill();ctx.restore();
    }
    ctx.beginPath();ctx.arc(cx,cy,rad*.14,0,Math.PI*2);ctx.fillStyle=col2;ctx.fill();
  }
  for(let i=0;i<density*3+5;i++) drawLeaf(ctx,r()*W,r()*H,12+r()*20,r()*Math.PI*2,c3+"88");
  rose(W/2,H/2,Math.min(W,H)*.2,c1,c2);
  const n=density*2+4;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2,d=Math.min(W,H)*(.22+r()*.2);
    rose(W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,14+r()*22,i%2===0?c1:c3,c2);
  }
}
function pVines(ctx,W,H,c1,c2,c3,density,seed){
  const r=mkRng(seed),nv=Math.floor(density*.7)+2;
  for(let v=0;v<nv;v++){
    const sx=r()*W,sy=r()*H,ex=r()*W,ey=r()*H,cx1=r()*W,cy1=r()*H,cx2=r()*W,cy2=r()*H;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.bezierCurveTo(cx1,cy1,cx2,cy2,ex,ey);
    ctx.strokeStyle=c3+"BB";ctx.lineWidth=2;ctx.stroke();
    const lc=density+4;
    for(let l=0;l<lc;l++){
      const t=l/lc,mt=1-t;
      const bx=mt*mt*mt*sx+3*mt*mt*t*cx1+3*mt*t*t*cx2+t*t*t*ex;
      const by=mt*mt*mt*sy+3*mt*mt*t*cy1+3*mt*t*t*cy2+t*t*t*ey;
      const side=l%2===0?1:-1,len=10+r()*14;
      const ang=Math.atan2(ey-sy,ex-sx)+side*(Math.PI/3+r()*.3);
      drawLeaf(ctx,bx,by,len,ang,(l%2===0?c3:c1)+"BB");
      if(l%3===0){ctx.beginPath();ctx.arc(bx,by,4,0,Math.PI*2);ctx.fillStyle=c2;ctx.fill();}
    }
  }
}
function pMagnolia(ctx,W,H,c1,c2,c3,density,seed){
  const r=mkRng(seed);
  function mag(cx,cy,rad,col1,col2){
    for(let i=0;i<6;i++){
      const a=(i/6)*Math.PI*2-Math.PI/2;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.bezierCurveTo(-rad*.3,-rad*.35,-rad*.2,-rad*.85,0,-rad);
      ctx.bezierCurveTo(rad*.2,-rad*.85,rad*.3,-rad*.35,0,0);
      ctx.fillStyle=col1+"CC";ctx.fill();
      ctx.strokeStyle=col2+"44";ctx.lineWidth=.5;ctx.stroke();ctx.restore();
    }
    ctx.beginPath();ctx.arc(cx,cy,rad*.16,0,Math.PI*2);ctx.fillStyle=col2;ctx.fill();
  }
  for(let i=0;i<density*3+6;i++) drawLeaf(ctx,r()*W,r()*H,15+r()*22,r()*Math.PI*2,c3+"77");
  mag(W/2,H/2,Math.min(W,H)*.24,c1,c2);
  const n=density*2+4;
  for(let i=0;i<n;i++){
    const a=r()*Math.PI*2,d=Math.min(W,H)*(.2+r()*.3),rad=Math.min(W,H)*(.08+r()*.13);
    mag(W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,rad,i%2===0?c3:c1,c2);
  }
}

/* ── geometric ────────────────────────────────────────────────── */
function pHoneycomb(ctx,W,H,c1,c2,c3,density){
  const sz=Math.max(12,48-density*4),sqH=sz*Math.sqrt(3),cols=[c1,c2,c3];
  for(let row=-1;row<H/sqH+2;row++){
    for(let col=-1;col<W/(sz*1.5)+2;col++){
      const x=col*sz*1.5,y=row*sqH+(col%2===0?0:sqH/2),ci=Math.abs((row*3+col)%3);
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2+Math.PI/6,px=x+Math.cos(a)*sz*.92,py=y+Math.sin(a)*sz*.92;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
      ctx.closePath();ctx.fillStyle=cols[ci]+"55";ctx.fill();ctx.strokeStyle=cols[ci]+"BB";ctx.lineWidth=1;ctx.stroke();
    }
  }
}
function pMandala(ctx,W,H,c1,c2,c3,density){
  const cx=W/2,cy=H/2,maxR=Math.min(W,H)*.44,layers=Math.min(8,density+3),cols=[c1,c2,c3];
  for(let l=layers;l>=1;l--){
    const r=(l/layers)*maxR,innerR=((l-1)/layers)*maxR,midR=(r+innerR)/2,numP=l*6,col=cols[(l-1)%3];
    for(let i=0;i<numP;i++){
      const a=(i/numP)*Math.PI*2,px=cx+Math.cos(a)*midR,py=cy+Math.sin(a)*midR;
      ctx.save();ctx.translate(px,py);ctx.rotate(a+Math.PI/2);
      ctx.beginPath();ctx.ellipse(0,0,(r-innerR)*.45,maxR*.055,0,0,Math.PI*2);
      ctx.fillStyle=col+(l%2===0?"88":"55");ctx.fill();ctx.strokeStyle=col+"AA";ctx.lineWidth=.5;ctx.stroke();ctx.restore();
    }
  }
  ctx.beginPath();ctx.arc(cx,cy,maxR/layers*.7,0,Math.PI*2);ctx.fillStyle=c1;ctx.fill();
}
function pDiagonal(ctx,W,H,c1,c2,c3,density){
  const sw=Math.max(18,52-density*4),cols=[c1+"99",c2+"99",c3+"99"],diag=Math.sqrt(W*W+H*H)+sw*4;
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(Math.PI/4);
  const n=Math.ceil(diag/sw)+2;
  for(let i=-n;i<=n;i++){ctx.fillStyle=cols[Math.abs(i)%3];ctx.fillRect(i*sw-sw/2,-diag/2,sw,diag);}
  ctx.restore();
}
function pArgyle(ctx,W,H,c1,c2,c3,density){
  const ds=Math.max(28,75-density*5),cols=[c1,c2,c3];
  for(let row=-2;row<H/(ds*.55)+2;row++){
    for(let col=-2;col<W/ds+2;col++){
      const cx=col*ds+(row%2===0?0:ds/2),cy=row*ds*.55,ci=Math.abs((row+col)%3);
      ctx.save();ctx.translate(cx,cy);
      ctx.beginPath();ctx.moveTo(0,-ds*.53);ctx.lineTo(ds*.46,0);ctx.lineTo(0,ds*.53);ctx.lineTo(-ds*.46,0);ctx.closePath();
      ctx.fillStyle=cols[ci]+"66";ctx.fill();ctx.strokeStyle=cols[ci]+"AA";ctx.lineWidth=1;ctx.stroke();ctx.restore();
    }
  }
}

/* ── holiday ──────────────────────────────────────────────────── */
function pSnowflake(ctx,W,H,c1,c2,c3,density,seed){
  const r=mkRng(seed);
  function flake(cx,cy,rad,col1,col2){
    for(let i=0;i<6;i++){
      ctx.save();ctx.translate(cx,cy);ctx.rotate((i/6)*Math.PI*2);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(rad,0);ctx.strokeStyle=col1;ctx.lineWidth=rad>20?2:1;ctx.stroke();
      for(let b=1;b<=3;b++){
        const bx=(b/4)*rad,bl=rad*.28*(1-b*.12);
        ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(bx+bl*.707,bl*.707);ctx.strokeStyle=col2;ctx.lineWidth=1;ctx.stroke();
        ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(bx+bl*.707,-bl*.707);ctx.stroke();
      }
      ctx.restore();
    }
    ctx.beginPath();ctx.arc(cx,cy,rad*.09,0,Math.PI*2);ctx.fillStyle=col2;ctx.fill();
  }
  flake(W/2,H/2,Math.min(W,H)*.22,c1,c2);
  for(let i=0;i<density*3+4;i++) flake(r()*W,r()*H,8+r()*28,i%2===0?c1:c3,c2);
}
function pHearts(ctx,W,H,c1,c2,c3,density,seed){
  const r=mkRng(seed),n=density*5+10,cols=[c1+"CC",c2+"CC",c3+"CC"];
  for(let i=0;i<n;i++){ctx.save();ctx.translate(r()*W,r()*H);ctx.rotate(r()*.6-.3);drawHeart(ctx,0,0,10+r()*26,cols[i%3]);ctx.restore();}
}
function pStars(ctx,W,H,c1,c2,c3,density,seed){
  const r=mkRng(seed),cols=[c1,c2,c3];
  drawStar(ctx,W/2,H/2,Math.min(W,H)*.22,8,c1+"BB",c2);
  for(let i=0;i<density*4+8;i++) drawStar(ctx,r()*W,r()*H,8+r()*22,4+Math.floor(r()*4),cols[i%3]+"BB",cols[(i+1)%3]);
}
function pTree(ctx,W,H,c1,c2,c3,density,seed){
  const r=mkRng(seed);
  function tree(cx,cy,h){
    ctx.fillStyle=c3;ctx.fillRect(cx-h*.06,cy+h*.55,h*.12,h*.2);
    for(let l=0;l<4;l++){
      const ly=cy-h*.8+l*h*.48,lw=h*.28+l*h*.22,lh=h*.38;
      ctx.beginPath();ctx.moveTo(cx,ly);ctx.lineTo(cx-lw,ly+lh);ctx.lineTo(cx+lw,ly+lh);ctx.closePath();
      ctx.fillStyle=(l%2===0?c1:c2)+"CC";ctx.fill();ctx.strokeStyle=c3+"88";ctx.lineWidth=.5;ctx.stroke();
    }
    drawStar(ctx,cx,cy-h*.86,h*.1,5,c2,c3);
  }
  tree(W/2,H/2,Math.min(W,H)*.55);
  for(let i=0;i<density*2+3;i++) tree(r()*W,r()*H,25+r()*55);
}

/* ── frames ───────────────────────────────────────────────────── */
function pNested(ctx,W,H,c1,c2,c3){
  const cols=[c1,c2,c3,c1,c2,c3];
  for(let l=0;l<6;l++){const m=(l+1)*Math.min(W,H)*.036;ctx.beginPath();ctx.rect(m,m,W-m*2,H-m*2);ctx.strokeStyle=cols[l];ctx.lineWidth=1.5+(5-l)*.3;ctx.stroke();}
}
function pScallop(ctx,W,H,c1,c2,c3){
  const r=14,cols=[c1,c2,c3];
  function row(horiz,len,flip){
    const n=Math.floor(len/(r*2)),off=(len-n*r*2)/2+r;
    for(let i=0;i<n;i++){
      const pos=off+i*r*2,cx=horiz?pos:(flip?W-r:r),cy=horiz?(flip?H-r:r):pos;
      ctx.beginPath();ctx.arc(cx,cy,r*.9,0,Math.PI*2);ctx.fillStyle=cols[i%3]+"66";ctx.fill();ctx.strokeStyle=cols[i%3];ctx.lineWidth=1;ctx.stroke();
    }
  }
  row(true,W,false);row(true,W,true);row(false,H,false);row(false,H,true);
  const m=r*2+4;ctx.beginPath();ctx.rect(m,m,W-m*2,H-m*2);ctx.strokeStyle=c1;ctx.lineWidth=1;ctx.stroke();
}
function pFlourish(ctx,W,H,c1,c2,c3){
  function corner(ox,oy,sx,sy){
    ctx.save();ctx.translate(ox,oy);ctx.scale(sx,sy);
    ctx.beginPath();
    for(let t=.3;t<=Math.PI*2.5;t+=.05){const rad=t*7;t===.3?ctx.moveTo(Math.cos(t)*rad,Math.sin(t)*rad):ctx.lineTo(Math.cos(t)*rad,Math.sin(t)*rad);}
    ctx.strokeStyle=c1;ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(55,0);ctx.strokeStyle=c2;ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,55);ctx.stroke();
    for(let d=1;d<=4;d++){ctx.beginPath();ctx.arc(d*13,0,2.5,0,Math.PI*2);ctx.fillStyle=c3;ctx.fill();ctx.beginPath();ctx.arc(0,d*13,2.5,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
  corner(0,0,1,1);corner(W,0,-1,1);corner(0,H,1,-1);corner(W,H,-1,-1);
  const m=68;ctx.beginPath();ctx.rect(m,m,W-m*2,H-m*2);ctx.strokeStyle=c1+"77";ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.rect(m+4,m+4,W-(m+4)*2,H-(m+4)*2);ctx.strokeStyle=c2+"55";ctx.lineWidth=.8;ctx.stroke();
}
function pRibbon(ctx,W,H,c1,c2,c3){
  const bw=22,cols=[c1,c2,c3],n=Math.ceil(Math.max(W,H)/bw)+1;
  function strip(x,y,w,h,col){ctx.fillStyle=col+"88";ctx.fillRect(x,y,w,h);ctx.strokeStyle=col+"CC";ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);}
  for(let i=0;i<n;i++){const ci=i%3;strip(i*bw,0,bw,bw,cols[ci]);strip(i*bw,H-bw,bw,bw,cols[(ci+1)%3]);strip(0,i*bw,bw,bw,cols[(ci+2)%3]);strip(W-bw,i*bw,bw,bw,cols[ci]);}
  [bw+4,bw+8].forEach((m,i)=>{ctx.beginPath();ctx.rect(m,m,W-m*2,H-m*2);ctx.strokeStyle=[c1,c2][i];ctx.lineWidth=1.5-i*.5;ctx.stroke();});
}

/* ── text renderer ────────────────────────────────────────────── */
function renderText(ctx,W,H,phrase,fontFamily,fontSize,bold,textColor,shadow,align,yFrac,spacing){
  if(!phrase.trim()) return;
  const weight=bold?"bold":"normal";
  ctx.font=`${weight} ${fontSize}px "${fontFamily}"`;
  ctx.textAlign=align;ctx.textBaseline="middle";
  try{ ctx.letterSpacing=spacing+"px"; }catch(e){}
  const margin=24,maxW=W-margin*2,x=align==="left"?margin:align==="right"?W-margin:W/2;
  const words=phrase.split(" ");const lines=[];let cur="";
  for(const w of words){const test=cur?cur+" "+w:w;if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;}
  if(cur) lines.push(cur);
  const lh=fontSize*1.28,totalH=lines.length*lh,startY=yFrac*H-(totalH/2)+(lh/2);
  lines.forEach((line,i)=>{
    const ly=startY+i*lh;
    if(shadow){ctx.shadowColor="rgba(0,0,0,0.55)";ctx.shadowBlur=fontSize*.18;ctx.shadowOffsetX=fontSize*.06;ctx.shadowOffsetY=fontSize*.06;}
    ctx.fillStyle=textColor;ctx.fillText(line,x,ly);
    ctx.shadowColor="transparent";ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
  });
}

/* ── pattern dispatch ─────────────────────────────────────────── */
function renderPattern(canvas,cat,patId,c1,c2,c3,density,seed,bg,sizeKey,noPattern){
  const{W,H}=SIZES[sizeKey];
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(noPattern) return;
  const map={
    "floral:daisy":()=>pDaisy(ctx,W,H,c1,c2,c3,density,seed),
    "floral:roses":()=>pRoses(ctx,W,H,c1,c2,c3,density,seed),
    "floral:vines":()=>pVines(ctx,W,H,c1,c2,c3,density,seed),
    "floral:magnolia":()=>pMagnolia(ctx,W,H,c1,c2,c3,density,seed),
    "geometric:honeycomb":()=>pHoneycomb(ctx,W,H,c1,c2,c3,density),
    "geometric:mandala":()=>pMandala(ctx,W,H,c1,c2,c3,density),
    "geometric:diagonal":()=>pDiagonal(ctx,W,H,c1,c2,c3,density),
    "geometric:argyle":()=>pArgyle(ctx,W,H,c1,c2,c3,density),
    "holiday:snowflake":()=>pSnowflake(ctx,W,H,c1,c2,c3,density,seed),
    "holiday:hearts":()=>pHearts(ctx,W,H,c1,c2,c3,density,seed),
    "holiday:stars":()=>pStars(ctx,W,H,c1,c2,c3,density,seed),
    "holiday:tree":()=>pTree(ctx,W,H,c1,c2,c3,density,seed),
    "frame:nested":()=>pNested(ctx,W,H,c1,c2,c3),
    "frame:scallop":()=>pScallop(ctx,W,H,c1,c2,c3),
    "frame:flourish":()=>pFlourish(ctx,W,H,c1,c2,c3),
    "frame:ribbon":()=>pRibbon(ctx,W,H,c1,c2,c3),
  };
  const fn=map[`${cat}:${patId}`];
  if(fn) fn();
}

async function loadDesign(placed){
  let url,revoke=false;
  if(placed.kind==="svg"){
    url=URL.createObjectURL(new Blob([placed.data],{type:"image/svg+xml"}));
    revoke=true;
  } else url=placed.data;
  try{ return await loadImg(url); }
  finally{ if(revoke) URL.revokeObjectURL(url); }
}

function FlowerMark(){

  });
  return (
    <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

/* ── app ──────────────────────────────────────────────────────── */
function App(){
  const[noPattern,setNoPattern]=useState(false);
  const[cat,setCat]       =useState("floral");
  const[patId,setPatId]   =useState("daisy");
  const[palIdx,setPalIdx] =useState(0);
  const[c1,setC1]         =useState(PALETTES[0].c1);
  const[c2,setC2]         =useState(PALETTES[0].c2);
  const[c3,setC3]         =useState(PALETTES[0].c3);
  const[density,setDensity]=useState(5);
  const[bg,setBg]         =useState("#FFFFFF");
  const[sizeKey,setSizeKey]=useState("p57");
  const[seed,setSeed]     =useState(42);
  /* text */
  const[phrase,setPhrase] =useState("");
  const[fontFam,setFontFam]=useState("Dancing Script");
  const[fontSize,setFS]   =useState(48);
  const[bold,setBold]     =useState(false);
  const[shadow,setShadow] =useState(true);
  const[tColor,setTColor] =useState(INK);
  const[tAlign,setTAlign] =useState("center");
  const[tY,setTY]         =useState(.5);
  const[spacing,setSpacing]=useState(0);
  const[showFP,setShowFP] =useState(false);
  const[fontsReady,setFontsReady]=useState(false);
  /* artwork */
  const[artMode,setArtMode]=useState("describe");
  const[aiStyle,setAiStyle]=useState("botanical");
  const[aiDesc,setAiDesc]  =useState("");
  const[aiOpts,setAiOpts]  =useState([null,null]);
  const[aiBusy,setAiBusy]  =useState([false,false]);
  const[aiStage,setAiStage]=useState(["",""]);
  const[aiErr,setAiErr]    =useState("");
  const[photoURL,setPhotoURL]=useState(null);
  const[photoErr,setPhotoErr]=useState("");
  const[photoAction,setPhotoAction]=useState("ai");
  const[styMode,setStyMode]  =useState("poster");
  const[styStrength,setStyStrength]=useState(.5);
  const[styPreview,setStyPreview] =useState(null);
  const[ownURL,setOwnURL]  =useState(null);
  const[ownErr,setOwnErr]  =useState("");
  /* placed design */
  const[placed,setPlaced] =useState(null);
  const[dX,setDX]         =useState(.5);
  const[dY,setDY]         =useState(.5);
  const[dSize,setDSize]   =useState(.5);

  const canvasRef=useRef(null);
  const photoImgRef=useRef(null);
  const photoFileRef=useRef(null);
  const ownFileRef=useRef(null);
  const drawSeq=useRef(0);

  useEffect(()=>{
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>setFontsReady(true));
    else setFontsReady(true);
  },[]);

  const redraw=useCallback(async()=>{
    const cv=canvasRef.current;
    if(!cv) return;
    const seq=++drawSeq.current;
    renderPattern(cv,cat,patId,c1,c2,c3,density,seed,bg,sizeKey,noPattern);
    const{W,H}=SIZES[sizeKey];
    const ctx=cv.getContext("2d");
    if(placed){
      try{
        const im=await loadDesign(placed);
        if(seq!==drawSeq.current) return;
        const s=dSize*Math.min(W,H);
        let dw=s,dh=s;
        if(placed.kind==="image"){
          const ar=im.width/im.height;
          if(ar>=1){ dw=s; dh=s/ar; } else { dh=s; dw=s*ar; }
        }
        ctx.drawImage(im,dX*W-dw/2,dY*H-dh/2,dw,dh);
      }catch(e){}
    }
    if(seq!==drawSeq.current) return;
    if(phrase.trim())
      renderText(ctx,W,H,phrase,fontFam,fontSize,bold,tColor,shadow,tAlign,tY,spacing);
  },[cat,patId,c1,c2,c3,density,seed,bg,sizeKey,noPattern,placed,dX,dY,dSize,
     phrase,fontFam,fontSize,bold,tColor,shadow,tAlign,tY,spacing]);

  useEffect(()=>{
    let cancelled=false;
    const run=()=>{ if(!cancelled) redraw(); };
    if(fontsReady) run();
    else if(document.fonts&&document.fonts.ready) document.fonts.ready.then(run);
    else run();
    return ()=>{ cancelled=true; };
  },[redraw,fontsReady]);

  useEffect(()=>{
    if(!photoImgRef.current){ setStyPreview(null); return; }
    try{ setStyPreview(stylizePhoto(photoImgRef.current,styMode,styStrength,c1,c2,c3)); }
    catch(e){ setStyPreview(null); }
  },[photoURL,styMode,styStrength,c1,c2,c3]);

  const applyPal=i=>{const p=PALETTES[i];setPalIdx(i);setC1(p.c1);setC2(p.c2);setC3(p.c3);};
  const changeCat=c=>{setCat(c);setPatId(PATS[c][0].id);};
  const chooseArtMode=m=>{setArtMode(m);setAiErr("");setAiOpts([null,null]);};

  const onPhoto=async e=>{
    const f=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!f) return;
    setPhotoErr("");
    try{
      const url=await fileToDataURL(f);
      const im=await loadImg(url);
      photoImgRef.current=im;
      setPhotoURL(url);
      setAiOpts([null,null]);setAiErr("");
    }catch(err){ setPhotoErr("That file would not open. Please try a JPG or PNG photo."); }
  };
  const onOwn=async e=>{
    const f=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!f) return;
    setOwnErr("");
    try{
      const url=await fileToDataURL(f);
      await loadImg(url);
      setOwnURL(url);
      setPlaced({kind:"image",data:url});
    }catch(err){ setOwnErr("That file would not open. A PNG (ideally with a clear background) works best."); }
  };

  const runGenerate=async(image)=>{
    if(AI_ENDPOINT.indexOf("PASTE")>-1){ setAiErr("The design service is not connected yet."); return; }
    if(!image&&!aiDesc.trim()) return;
    setAiErr("");setAiOpts([null,null]);setAiBusy([true,true]);
    setAiStage(["Sketching the design","Sketching the design"]);
    const slot=async i=>{
      try{
        const first=await genSVG(image?null:aiDesc,aiStyle,c1,c2,c3,image||null);
        if(!first){ setAiBusy(b=>{const n=[...b];n[i]=false;return n;}); return null; }
        setAiStage(s=>{const n=[...s];n[i]="Refining the details";return n;});
        const refined=await refineSVG(first,aiStyle,c1,c2,c3);
        setAiOpts(o=>{const n=[...o];n[i]=refined;return n;});
        setAiBusy(b=>{const n=[...b];n[i]=false;return n;});
        return refined;
      }catch(e){
        setAiBusy(b=>{const n=[...b];n[i]=false;return n;});
        return null;
      }
    };
    const results=await Promise.all([slot(0),slot(1)]);
    if(!results[0]&&!results[1])
      setAiErr("The designs did not come through. Try a clearer description, or check that the worker is deployed with its key.");
  };
  const generateFromPhoto=()=>{
    const img=photoImgRef.current;
    if(!img) return;
    let image;
    try{ image=imgToBase64(img,1100); }
    catch(e){ setAiErr("Could not read that photo."); return; }
    runGenerate(image);
  };

  const download=()=>{
    const cv=canvasRef.current;
    if(!cv) return;
    const a=document.createElement("a");
    a.download="skivvez-card.png";
    a.href=cv.toDataURL("image/png");
    a.click();
  };
  const resetAll=()=>{
    if(!window.confirm("Clear this card and start over?")) return;
    setNoPattern(false);setCat("floral");setPatId("daisy");
    setPalIdx(0);setC1(PALETTES[0].c1);setC2(PALETTES[0].c2);setC3(PALETTES[0].c3);
    setDensity(5);setBg("#FFFFFF");setSizeKey("p57");setSeed(42);
    setPhrase("");setFontFam("Dancing Script");setFS(48);setBold(false);setShadow(true);
    setTColor(INK);setTAlign("center");setTY(.5);setSpacing(0);setShowFP(false);
    setArtMode("describe");setAiStyle("botanical");setAiDesc("");setAiOpts([null,null]);
    setAiBusy([false,false]);setAiStage(["",""]);setAiErr("");
    setPhotoURL(null);setPhotoErr("");setPhotoAction("ai");
    setStyMode("poster");setStyStrength(.5);setStyPreview(null);
    setOwnURL(null);setOwnErr("");
    setPlaced(null);setDX(.5);setDY(.5);setDSize(.5);
    photoImgRef.current=null;
  };

  const busy=aiBusy[0]||aiBusy[1];
  const canvasLabel=`${SIZES[sizeKey].label.trim()} greeting card preview`
    +(placed?", with a custom design":"")
    +(phrase.trim()?`, with the phrase "${phrase.trim()}"`:"");

  /* style picker, shared by Describe and Photo-to-art */
  const stylePicker=()=>(
    <div style={{marginBottom:12}}>
      <span style={FLD_LBL}>Art style</span>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
        {ART_STYLES.map(s=>(
          <button key={s.id} onClick={()=>setAiStyle(s.id)} aria-pressed={aiStyle===s.id}
            style={{...seg(aiStyle===s.id),padding:"8px 6px"}}>{s.label}</button>
        ))}
      </div>
      <div style={{fontSize:11,color:MUTE,marginTop:6,fontStyle:"italic"}}>
        {(ART_STYLES.find(s=>s.id===aiStyle)||ART_STYLES[0]).hint}
      </div>
    </div>
  );

  /* generation status + the two option previews */
  const aiResults=()=>{
    if(!busy&&!aiOpts[0]&&!aiOpts[1]&&!aiErr) return null;
    return (
      <div style={{marginTop:12}}>
        <div aria-live="polite" style={{minHeight:1}}>
          {busy&&(
            <div style={{fontSize:11.5,color:MUTE,marginBottom:9}}>
              Creating your designs. This can take up to a minute.
            </div>
          )}
        </div>
        {aiErr&&(
          <div role="alert" style={{fontSize:11,color:ACCENT_DK,background:ACCENT_SOFT,
            border:`1px solid ${ACCENT}`,borderRadius:7,padding:"7px 9px",marginBottom:9}}>
            {aiErr}
          </div>
        )}
        {(busy||aiOpts[0]||aiOpts[1])&&(
          <div style={{display:"flex",gap:8}}>
            {[0,1].map(i=>(
              <div key={i} style={{flex:1}}>
                <div style={{border:`1px solid ${placed&&placed.kind==="svg"&&placed.data===aiOpts[i]?INK:LINE}`,
                  borderRadius:8,overflow:"hidden",background:"#fff",aspectRatio:"1",
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {aiBusy[i]?(
                    <span style={{fontSize:10.5,color:MUTE,textAlign:"center",padding:6}}>{aiStage[i]}</span>
                  ):aiOpts[i]?(
                    <div className="ai-prev" role="img" aria-label={`Design option ${i+1}`}
                      style={{width:"100%",height:"100%"}}
                      dangerouslySetInnerHTML={{__html:aiOpts[i]}}/>
                  ):(
                    <span style={{fontSize:10.5,color:MUTE,padding:6}}>No result</span>
                  )}
                </div>
                {aiOpts[i]&&(
                  <button onClick={()=>setPlaced({kind:"svg",data:aiOpts[i]})}
                    style={{width:"100%",marginTop:6,padding:"7px",borderRadius:7,cursor:"pointer",
                      fontSize:11,fontWeight:600,
                      border:`1px solid ${ACCENT_DK}`,
                      background:placed&&placed.kind==="svg"&&placed.data===aiOpts[i]?ACCENT_DK:"#fff",
                      color:placed&&placed.kind==="svg"&&placed.data===aiOpts[i]?"#fff":ACCENT_DK}}>
                    {placed&&placed.kind==="svg"&&placed.data===aiOpts[i]?"On your card ✓":"Use this"}
                  </button>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  return (
  <div className="studio">

    <header style={{display:"flex",alignItems:"center",gap:13,padding:"14px 22px",
                    borderBottom:`1px solid ${LINE}`,flexShrink:0,background:CARD}}>
      <span style={{width:34,height:34,borderRadius:9,background:ACCENT,
                    display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
        <FlowerMark/>
      </span>
      <div>
        <h1 style={{margin:0,fontFamily:'"Fraunces",Georgia,serif',fontSize:21,fontWeight:600,
                    color:INK,letterSpacing:".01em",lineHeight:1.1}}>
          Christine&rsquo;s Skivvez Studio
        </h1>
        <div style={{fontSize:10.5,letterSpacing:".15em",textTransform:"uppercase",
                     color:MUTE,marginTop:3,fontWeight:600}}>
          Die-cut card design studio
        </div>
      </div>
    </header>

    <div className="body">

      {/* ── controls ── */}
      <div className="controls">
        <div className="sections">

          {/* PATTERN */}
          <Section title="Background Pattern" first>
            <button onClick={()=>setNoPattern(v=>!v)} aria-pressed={noPattern}
              style={{width:"100%",marginBottom:11,padding:"10px 11px",textAlign:"left",
                      border:`1px solid ${noPattern?INK:LINE}`,borderRadius:8,cursor:"pointer",
                      background:noPattern?ACCENT_SOFT:CARD,color:INK,fontSize:12,
                      display:"flex",alignItems:"center",gap:9}}>
              <span aria-hidden="true" style={{fontSize:15,lineHeight:1}}>{noPattern?"◉":"○"}</span>
              <span>No background pattern <span style={{color:MUTE}}>(clean card)</span></span>
            </button>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,opacity:noPattern?.45:1}}>
              {CATS.map(c=>(
                <button key={c.id} onClick={()=>changeCat(c.id)} disabled={noPattern}
                  aria-pressed={cat===c.id}
                  style={{...seg(cat===c.id),display:"flex",flexDirection:"column",alignItems:"center",
                          gap:3,padding:"9px 4px",cursor:noPattern?"default":"pointer"}}>
                  <span aria-hidden="true" style={{fontSize:16}}>{c.icon}</span>
                  <span>{c.label}</span>
                </button>
              ))}
            </div>
            {!noPattern&&(
              <div style={{display:"flex",flexDirection:"column",gap:5,marginTop:9}}>
                {PATS[cat].map(p=>(
                  <button key={p.id} onClick={()=>setPatId(p.id)} aria-pressed={patId===p.id}
                    style={{...seg(patId===p.id),textAlign:"left",padding:"9px 11px"}}>
                    {p.label}
                  </button>
                ))}
              </div>
            )}
            {!noPattern&&(
              <div style={{marginTop:13}}>
                <label>
                  <span style={FLD_LBL}>Density &middot; {density}</span>
                  <input type="range" min={1} max={10} value={density}
                    onChange={e=>setDensity(+e.target.value)}/>
                </label>
                <div style={RANGE_ENDS}><span>Light</span><span>Dense</span></div>
                <button onClick={()=>setSeed(Math.floor(Math.random()*99999))}
                  style={{width:"100%",marginTop:10,padding:"9px",background:CARD,color:INK,
                          border:`1px solid ${LINE}`,borderRadius:8,cursor:"pointer",
                          fontSize:12,fontWeight:600}}>
                  Shuffle Pattern
                </button>
              </div>
            )}
          </Section>

          {/* CARD SIZE */}
          <Section title="Card Size">
            <label>
              <span style={FLD_LBL}>Greeting card shape</span>
              <select value={sizeKey} onChange={e=>setSizeKey(e.target.value)} style={INP}>
                {Object.entries(SIZES).map(([k,v])=>(
                  <option key={k} value={k}>{v.label}</option>
                ))}
              </select>
            </label>
          </Section>

          {/* PALETTE */}
          <Section title="Color Palette">
            <div role="group" aria-label="Preset palettes"
                 style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:11}}>
              {PALETTES.map((p,i)=>(
                <button key={i} onClick={()=>applyPal(i)} aria-pressed={palIdx===i}
                  aria-label={`${p.name} palette`}
                  style={{padding:"6px 4px",border:`1.5px solid ${palIdx===i?INK:LINE}`,
                          borderRadius:8,background:CARD,cursor:"pointer"}}>
                  <span style={{display:"flex",gap:3,justifyContent:"center",marginBottom:4}}>
                    {[p.c1,p.c2,p.c3].map((c,j)=>(
                      <span key={j} style={{width:13,height:13,borderRadius:"50%",background:c,
                                            border:`1px solid ${LINE}`}}/>
                    ))}
                  </span>
                  <span style={{fontSize:9.5,color:MUTE}}>{p.name}</span>
                </button>
              ))}
            </div>
            <div style={{display:"flex",gap:7}}>
              {[["Color 1",c1,setC1],["Color 2",c2,setC2],["Color 3",c3,setC3]].map(([lbl,val,set])=>(
                <label key={lbl} style={{flex:1,textAlign:"center"}}>
                  <span style={{...FLD_LBL,marginBottom:4}}>{lbl}</span>
                  <input type="color" value={val} aria-label={lbl}
                    onChange={e=>{set(e.target.value);setPalIdx(-1);}}
                    style={{width:"100%",height:30,border:`1px solid ${LINE}`,borderRadius:7,
                            cursor:"pointer",padding:2,background:CARD}}/>
                </label>
              ))}
            </div>
          </Section>

          {/* BACKGROUND */}
          <Section title="Card Background">
            <span style={FLD_LBL}>Paper color</span>
            <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"center"}}>
              {["#FFFFFF","#FBF7F0","#F1ECE3","#EDF1F2","#F6EEF0","#EFF2EC"].map(b=>(
                <button key={b} onClick={()=>setBg(b)} aria-pressed={bg===b}
                  aria-label={`Background ${b}`}
                  style={{width:30,height:30,borderRadius:7,background:b,cursor:"pointer",
                          border:bg===b?`2.5px solid ${INK}`:`1px solid ${LINE}`}}/>
              ))}
              <input type="color" value={bg} onChange={e=>setBg(e.target.value)}
                aria-label="Custom background color"
                style={{width:30,height:30,border:`1px solid ${LINE}`,borderRadius:7,
                        cursor:"pointer",padding:2,background:CARD}}/>
            </div>
          </Section>

          {/* ARTWORK */}
          <Section title="Artwork">
            <p style={{margin:"0 0 11px",fontSize:11.5,color:MUTE,lineHeight:1.5}}>
              Add a flower or illustration to your card.
            </p>
            <div role="group" aria-label="Artwork source"
                 style={{display:"flex",gap:5,marginBottom:13}}>
              {[["describe","Describe it"],["photo","From a photo"],["own","My own art"]].map(([m,lbl])=>(
                <button key={m} onClick={()=>chooseArtMode(m)} aria-pressed={artMode===m}
                  style={{...seg(artMode===m),flex:1,padding:"8px 4px",fontSize:11}}>{lbl}</button>
              ))}
            </div>

            {/* describe */}
            {artMode==="describe"&&(
              <div>
                {stylePicker()}
                <label>
                  <span style={FLD_LBL}>Describe your design</span>
                  <textarea value={aiDesc} onChange={e=>setAiDesc(e.target.value)} rows={3}
                    placeholder="a hummingbird and a hibiscus, a golden retriever with a bow, a lighthouse on a rocky coast…"
                    style={{...INP,resize:"none"}}/>
                </label>
                <button onClick={()=>runGenerate(null)} disabled={busy||!aiDesc.trim()}
                  style={{width:"100%",marginTop:10,padding:"11px",borderRadius:8,
                    border:"none",fontSize:12.5,fontWeight:600,
                    cursor:busy||!aiDesc.trim()?"default":"pointer",
                    background:ACCENT_DK,color:"#fff",
                    opacity:(!busy&&!aiDesc.trim())?.5:1}}>
                  {busy?"Creating…":"Create 2 designs"}
                </button>
                {aiResults()}
              </div>
            )}

            {/* photo */}
            {artMode==="photo"&&(
              <div>
                <input ref={photoFileRef} type="file" accept="image/*" onChange={onPhoto}
                  aria-label="Upload a photo" style={HIDDEN_FILE}/>
                <button onClick={()=>photoFileRef.current&&photoFileRef.current.click()}
                  style={{width:"100%",padding:"11px",background:CARD,color:INK,
                          border:`1.5px dashed ${ACCENT}`,borderRadius:8,cursor:"pointer",
                          fontSize:12.5,fontWeight:600}}>
                  {photoURL?"Choose a different photo":"Choose a photo…"}
                </button>
                {photoErr&&(
                  <div role="alert" style={{marginTop:8,fontSize:11,color:ACCENT_DK,
                    background:ACCENT_SOFT,border:`1px solid ${ACCENT}`,borderRadius:7,padding:"7px 9px"}}>
                    {photoErr}
                  </div>
                )}
                {photoURL&&(
                  <div style={{marginTop:12}}>
                    <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12}}>
                      <img src={photoURL} alt="The photo you uploaded"
                        style={{width:54,height:54,objectFit:"cover",borderRadius:8,
                                border:`1px solid ${LINE}`,flexShrink:0}}/>
                      <span style={{fontSize:11,color:MUTE,lineHeight:1.5}}>
                        Choose how to turn it into card artwork.
                      </span>
                    </div>
                    <div role="group" aria-label="Photo treatment"
                         style={{display:"flex",gap:5,marginBottom:12}}>
                      {[["ai","Draw as art"],["stylize","Quick stylize"]].map(([m,lbl])=>(
                        <button key={m} onClick={()=>{setPhotoAction(m);setAiOpts([null,null]);setAiErr("");}}
                          aria-pressed={photoAction===m}
                          style={{...seg(photoAction===m),flex:1}}>{lbl}</button>
                      ))}
                    </div>

                    {photoAction==="ai"&&(
                      <div>
                        <p style={{margin:"0 0 11px",fontSize:11,color:MUTE,lineHeight:1.5}}>
                          The AI studies your photo and draws a fresh, clean illustration from it.
                        </p>
                        {stylePicker()}
                        <button onClick={generateFromPhoto} disabled={busy}
                          style={{width:"100%",padding:"11px",borderRadius:8,border:"none",
                            fontSize:12.5,fontWeight:600,cursor:busy?"default":"pointer",
                            background:ACCENT_DK,color:"#fff"}}>
                          {busy?"Creating…":"Create 2 designs from photo"}
                        </button>
                        {aiResults()}
                      </div>
                    )}

                    {photoAction==="stylize"&&(
                      <div>
                        <span style={FLD_LBL}>Style</span>
                        <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:11}}>
                          {STY_MODES.map(m=>(
                            <button key={m.id} onClick={()=>setStyMode(m.id)} aria-pressed={styMode===m.id}
                              style={{...seg(styMode===m.id),textAlign:"left",padding:"8px 11px"}}>
                              <span style={{display:"block"}}>{m.label}</span>
                              <span style={{display:"block",fontSize:10,fontWeight:400,marginTop:2,
                                color:styMode===m.id?"rgba(255,255,255,.78)":MUTE}}>{m.hint}</span>
                            </button>
                          ))}
                        </div>
                        <label>
                          <span style={FLD_LBL}>
                            {styMode==="ink"?"Line detail":"Strength"} &middot; {Math.round(styStrength*100)}%
                          </span>
                          <input type="range" min={0} max={100} value={Math.round(styStrength*100)}
                            onChange={e=>setStyStrength(+e.target.value/100)}/>
                        </label>
                        {styPreview&&(
                          <div style={{marginTop:12}}>
                            <span style={FLD_LBL}>Preview</span>
                            <div style={{border:`1px solid ${LINE}`,borderRadius:8,overflow:"hidden",
                                         background:"#fff",display:"flex",justifyContent:"center"}}>
                              <img src={styPreview} alt="Stylized version of your photo"
                                style={{maxWidth:"100%",maxHeight:150,display:"block"}}/>
                            </div>
                            <button onClick={()=>setPlaced({kind:"image",data:styPreview})}
                              style={{width:"100%",marginTop:9,padding:"11px",border:"none",
                                borderRadius:8,cursor:"pointer",fontSize:12.5,fontWeight:600,
                                background:placed&&placed.kind==="image"&&placed.data===styPreview?ACCENT_DK:ACCENT_DK,
                                color:"#fff"}}>
                              {placed&&placed.kind==="image"&&placed.data===styPreview?"On your card ✓":"Use this on my card"}
                            </button>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* own */}
            {artMode==="own"&&(
              <div>
                <p style={{margin:"0 0 11px",fontSize:11,color:MUTE,lineHeight:1.5}}>
                  Upload clip art or an illustration you already like. It is placed on the card
                  as-is, with no filter. A PNG with a clear background works best.
                </p>
                <input ref={ownFileRef} type="file" accept="image/*" onChange={onOwn}
                  aria-label="Upload your own artwork" style={HIDDEN_FILE}/>
                <button onClick={()=>ownFileRef.current&&ownFileRef.current.click()}
                  style={{width:"100%",padding:"11px",background:CARD,color:INK,
                          border:`1.5px dashed ${ACCENT}`,borderRadius:8,cursor:"pointer",
                          fontSize:12.5,fontWeight:600}}>
                  {ownURL?"Choose different artwork":"Choose artwork…"}
                </button>
                {ownErr&&(
                  <div role="alert" style={{marginTop:8,fontSize:11,color:ACCENT_DK,
                    background:ACCENT_SOFT,border:`1px solid ${ACCENT}`,borderRadius:7,padding:"7px 9px"}}>
                    {ownErr}
                  </div>
                )}
                {ownURL&&(
                  <div style={{display:"flex",gap:10,alignItems:"center",marginTop:12}}>
                    <img src={ownURL} alt="Your uploaded artwork"
                      style={{width:54,height:54,objectFit:"contain",borderRadius:8,
                              border:`1px solid ${LINE}`,background:"#fff",flexShrink:0}}/>
                    <span style={{fontSize:11,color:MUTE,lineHeight:1.5}}>
                      It is on your card. Position it below.
                    </span>
                  </div>
                )}
              </div>
            )}

            {/* placement */}
            {placed&&(
              <div style={{marginTop:14,paddingTop:14,borderTop:`1px solid ${LINE}`}}>
                <span style={FLD_LBL}>Place on card</span>
                <div style={{display:"flex",gap:13,alignItems:"flex-start"}}>
                  <div role="group" aria-label="Artwork position"
                       style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4,flexShrink:0}}>
                    {POS_GRID.flat().map((pos,i)=>{
                      const on=Math.abs(dX-pos.x)<.05&&Math.abs(dY-pos.y)<.05;
                      return (
                        <button key={i} aria-label={pos.label} aria-pressed={on}
                          onClick={()=>{setDX(pos.x);setDY(pos.y);}}
                          style={{width:24,height:24,borderRadius:6,cursor:"pointer",
                                  border:`1.5px solid ${on?INK:LINE}`,background:on?INK:CARD}}/>
                      );
                    })}
                  </div>
                  <label style={{flex:1}}>
                    <span style={{...FLD_LBL,marginBottom:4}}>Size &middot; {Math.round(dSize*100)}%</span>
                    <input type="range" min={15} max={95} value={Math.round(dSize*100)}
                      onChange={e=>setDSize(+e.target.value/100)}/>
                    <div style={RANGE_ENDS}><span>Small</span><span>Large</span></div>
                  </label>
                </div>
                <button onClick={()=>setPlaced(null)}
                  style={{width:"100%",marginTop:10,padding:"8px",background:"transparent",
                          color:MUTE,border:`1px solid ${LINE}`,borderRadius:8,cursor:"pointer",
                          fontSize:11}}>
                  Remove artwork from card
                </button>
              </div>
            )}
          </Section>

          {/* TEXT */}
          <Section title="Text and Phrases">
            <label>
              <span style={FLD_LBL}>Your phrase</span>
              <textarea value={phrase} onChange={e=>setPhrase(e.target.value)} rows={2}
                placeholder="Happy Birthday, With Love, Thank You…"
                style={{...INP,resize:"none"}}/>
            </label>

            <div style={{marginTop:12}}>
              <span style={FLD_LBL}>Font</span>
              <button type="button" onClick={()=>setShowFP(v=>!v)}
                aria-haspopup="listbox" aria-expanded={showFP}
                style={{...INP,display:"flex",justifyContent:"space-between",alignItems:"center",
                        cursor:"pointer",textAlign:"left"}}>
                <span style={{fontFamily:`"${fontFam}"`,fontSize:17}}>{fontFam}</span>
                <span aria-hidden="true" style={{fontSize:10,color:MUTE}}>{showFP?"▲":"▼"}</span>
              </button>
              {showFP&&(
                <ul role="listbox" aria-label="Font"
                    onKeyDown={e=>{ if(e.key==="Escape") setShowFP(false); }}
                    style={{listStyle:"none",margin:"4px 0 0",padding:0,border:`1px solid ${LINE}`,
                            borderRadius:8,background:CARD,maxHeight:208,overflowY:"auto"}}>
                  {FONTS.map(f=>(
                    <li key={f.family} role="option" aria-selected={fontFam===f.family}>
                      <button type="button" onClick={()=>{setFontFam(f.family);setShowFP(false);}}
                        style={{width:"100%",textAlign:"left",padding:"8px 11px",border:"none",
                                cursor:"pointer",fontFamily:`"${f.family}"`,fontSize:17,
                                background:fontFam===f.family?INK:"transparent",
                                color:fontFam===f.family?"#fff":INK}}>
                        {f.name}
                      </button>
                    </li>
                  ))}
                </ul>
              )}
            </div>

            <div style={{marginTop:12}}>
              <label>
                <span style={FLD_LBL}>Size &middot; {fontSize}px</span>
                <input type="range" min={18} max={96} value={fontSize}
                  onChange={e=>setFS(+e.target.value)}/>
              </label>
            </div>
            <div style={{marginTop:10}}>
              <label>
                <span style={FLD_LBL}>Letter spacing &middot; {spacing}px</span>
                <input type="range" min={-2} max={20} value={spacing}
                  onChange={e=>setSpacing(+e.target.value)}/>
              </label>
            </div>

            <div style={{marginTop:12}}>
              <span style={FLD_LBL}>Text color</span>
              <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"center"}}>
                {[c1,c2,c3,INK,"#FFFFFF",ACCENT].map((col,i)=>(
                  <button key={i} onClick={()=>setTColor(col)} aria-pressed={tColor===col}
                    aria-label={`Text color ${col}`}
                    style={{width:30,height:30,borderRadius:7,background:col,cursor:"pointer",
                            border:tColor===col?`2.5px solid ${INK}`:`1px solid ${LINE}`}}/>
                ))}
                <input type="color" value={tColor} onChange={e=>setTColor(e.target.value)}
                  aria-label="Custom text color"
                  style={{width:30,height:30,border:`1px solid ${LINE}`,borderRadius:7,
                          cursor:"pointer",padding:2,background:CARD}}/>
              </div>
            </div>

            <div style={{marginTop:12}}>
              <span style={FLD_LBL}>Alignment</span>
              <div style={{display:"flex",gap:6}}>
                {[["left","Left"],["center","Center"],["right","Right"]].map(([v,lbl])=>(
                  <button key={v} onClick={()=>setTAlign(v)} aria-pressed={tAlign===v}
                    style={{...seg(tAlign===v),flex:1}}>{lbl}</button>
                ))}
              </div>
            </div>

            <div style={{marginTop:12}}>
              <span style={FLD_LBL}>Text position</span>
              <div style={{display:"flex",gap:6,marginBottom:8}}>
                {[["Top",.1],["Middle",.5],["Bottom",.88]].map(([lbl,v])=>(
                  <button key={lbl} onClick={()=>setTY(v)} aria-pressed={Math.abs(tY-v)<.001}
                    style={{...seg(Math.abs(tY-v)<.001),flex:1}}>{lbl}</button>
                ))}
              </div>
              <label>
                <span style={{...FLD_LBL,marginBottom:4}}>Fine-tune &middot; {Math.round(tY*100)}%</span>
                <input type="range" min={5} max={95} value={Math.round(tY*100)}
                  onChange={e=>setTY(+e.target.value/100)}/>
              </label>
            </div>

            <div style={{display:"flex",gap:6,marginTop:12}}>
              <button onClick={()=>setBold(v=>!v)} aria-pressed={bold}
                style={{...seg(bold),flex:1}}>Bold</button>
              <button onClick={()=>setShadow(v=>!v)} aria-pressed={shadow}
                style={{...seg(shadow),flex:1}}>Shadow</button>
            </div>
          </Section>

        </div>{/* /.sections */}

        <div className="foot">
          <button onClick={resetAll}
            style={{flex:"0 0 38%",padding:"13px 8px",background:CARD,color:INK,
                    border:`1px solid ${LINE}`,borderRadius:9,cursor:"pointer",
                    fontSize:12.5,fontWeight:600}}>
            Reset
          </button>
          <button onClick={download}
            style={{flex:1,padding:"13px",background:INK,color:"#fff",border:"none",
                    borderRadius:9,cursor:"pointer",fontSize:13,fontWeight:600,
                    letterSpacing:".02em"}}>
            Download PNG
          </button>
        </div>
      </div>{/* /.controls */}

      {/* ── preview ── */}
      <div className="preview" id="preview" tabIndex={-1}>
        <div style={{fontFamily:'"Fraunces",Georgia,serif',fontStyle:"italic",fontSize:14,
                     color:MUTE}}>Live preview</div>
        <div style={{boxShadow:"0 16px 40px rgba(34,31,29,.22)",borderRadius:2,
                     background:CARD,lineHeight:0}}>
          <canvas ref={canvasRef} role="img" aria-label={canvasLabel}
            style={{display:"block",maxWidth:"100%",maxHeight:600,borderRadius:2}}/>
        </div>
        <div style={{fontSize:10.5,letterSpacing:".07em",color:MUTE}}>
          {SIZES[sizeKey].label} &middot; {SIZES[sizeKey].W} &times; {SIZES[sizeKey].H} px
        </div>
      </div>

    </div>{/* /.body */}
  </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!-- iframe height-sender: lets the embedding Kajabi page size this frame correctly -->
<script>
(function(){
  var FRAME_ID = "mom-card-studio";
  function sendHeight(){
    var h = Math.max(
      document.documentElement.scrollHeight,
      document.body ? document.body.scrollHeight : 0
    );
    try{ parent.postMessage({ type:"resize-iframe", id:FRAME_ID, frameId:FRAME_ID, height:h }, "*"); }catch(e){}
  }
  window.addEventListener("load", sendHeight);
  window.addEventListener("resize", sendHeight);
  if(window.ResizeObserver){
    try{ new ResizeObserver(sendHeight).observe(document.body); }catch(e){}
  }
  document.addEventListener("DOMContentLoaded", sendHeight);
  setTimeout(sendHeight, 1200);
  setTimeout(sendHeight, 3000);
})();
</script>
</body>
</html>
